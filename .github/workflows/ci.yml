name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and gate tests (NFR-1, NFR-7)
        run: python -m unittest discover -s tests -t . -v
      - name: Simulated evaluation (NFR-4, NFR-5, NFR-6, NFR-9)
        run: python -m eval.run_eval --mode sim --out "$RUNNER_TEMP/report.json"
      - name: Parser microbenchmark (NFR-8)
        run: python -m bench.bench_parser

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a fresh venv (A4-12)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
      - name: Build and check the distribution
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install build twine
          "$RUNNER_TEMP/venv/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/venv/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
      - name: Smoke test outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py" --backend sim
          "$RUNNER_TEMP/venv/bin/tinyagent" --backend sim "What is 2+3?"
