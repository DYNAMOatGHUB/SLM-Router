name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Simulated evaluation
        run: |
          if [ -f tinyagent/parser.py ] && [ -f tinyagent/executor.py ] && [ -f tinyagent/coercion.py ]; then
            python -m eval.run_eval --mode sim
          else
            echo "Simulated evaluation deferred: parser, executor, or coercion module pending"
          fi
