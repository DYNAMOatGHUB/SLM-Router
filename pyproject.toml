[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slmrouter"
version = "0.1.0"
description = "A bounded, zero-runtime-dependency tool router for local language models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dhyanesh Mahendiran" }]
maintainers = [{ name = "Dhyanesh Mahendiran" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "slm", "agent", "tool-calling", "function-calling", "ollama", "llama.cpp", "local-llm", "small-language-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/DYNAMOatGHUB/SLM-Router"
Documentation = "https://github.com/DYNAMOatGHUB/SLM-Router#readme"
Repository = "https://github.com/DYNAMOatGHUB/SLM-Router"
Issues = "https://github.com/DYNAMOatGHUB/SLM-Router/issues"
Changelog = "https://github.com/DYNAMOatGHUB/SLM-Router/blob/main/CHANGELOG.md"

[project.scripts]
slmrouter = "slmrouter.cli:main"

[tool.setuptools.packages.find]
include = ["slmrouter*"]

[tool.setuptools.package-data]
slmrouter = ["py.typed"]
