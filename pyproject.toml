[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyagent"
version = "0.1.0"
description = "A bounded, zero-runtime-dependency tool router for local language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["tinyagent*", "examples*", "eval*"]

[tool.setuptools]
include-package-data = false
